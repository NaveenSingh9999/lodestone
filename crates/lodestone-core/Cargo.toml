[package]
name = "lodestone-core"
description = "Platform-independent core for Lodestone, an Android-first Minecraft Java server manager"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
sha1 = "0.10"
sha2 = "0.10"
futures-util = "0.3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "io-util", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip", "stream"] }
pgp = "0.21.0"
flate2 = "1.1.10"
lzma-rs = "0.3.0"
tar = "0.4.46"
hex = "0.4.3"
libc = "0.2.191"
md5 = "0.8.1"

[features]
default = []
tunnel = ["dep:playit-agent-core"]

[dependencies.playit-agent-core]
version = "0.20"
optional = true
