name: Android

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  native:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/26.3.11579264
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Install NDK
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "ndk;26.3.11579264" 2>&1 | tail -3
      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked 2>&1 | tail -3
      - name: Build native lib
        run: |
          cd crates/lodestone-ffi
          cargo ndk -t arm64-v8a -o ../../android/app/src/main/jniLibs build --release 2>&1 | tail -20
      - name: Upload jniLibs
        uses: actions/upload-artifact@v4
        with:
          name: jniLibs
          path: android/app/src/main/jniLibs

  build:
    runs-on: ubuntu-latest
    needs: native
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: jniLibs
          path: android/app/src/main/jniLibs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true
      - name: Install platform 34 + build-tools
        run: |
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0" 2>&1 | tail -3
      - name: Build Android app (release)
        working-directory: android
        run: gradle assembleRelease --stacktrace 2>&1 | tail -30
      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: lodestone-release-apk
          path: android/app/build/outputs/apk/release/*.apk
